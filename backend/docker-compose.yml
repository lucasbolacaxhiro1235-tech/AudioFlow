version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: audioflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audioflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audioflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audioflow-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/audioflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - R2_ENDPOINT=https://your-account-id.r2.cloudflarestorage.com
      - R2_ACCESS_KEY=your-access-key
      - R2_SECRET_KEY=your-secret-key
      - R2_BUCKET=audioflow
      - R2_PUBLIC_URL=https://pub-your-bucket-id.r2.dev
      - FRONTEND_URL=http://localhost:3000
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audioflow-worker
    command: celery -A app.workers.tasks worker --loglevel=info --queues=downloads --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/audioflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-change-in-production
      - R2_ENDPOINT=https://your-account-id.r2.cloudflarestorage.com
      - R2_ACCESS_KEY=your-access-key
      - R2_SECRET_KEY=your-secret-key
      - R2_BUCKET=audioflow
      - R2_PUBLIC_URL=https://pub-your-bucket-id.r2.dev
      - YTDLP_PATH=yt-dlp
      - FFMPEG_PATH=ffmpeg
      - FFPROBE_PATH=ffprobe
      - AUDIO_OUTPUT_FORMAT=mp3
      - AUDIO_QUALITY=192k
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

volumes:
  postgres_data:
  redis_data: